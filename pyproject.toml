[project]
name = "projet-generative-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "datasets>=5.1.0",
    "duckdb>=1.5.6",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings[yaml]>=2.15.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.50",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Racine du dépôt dans le sys.path : `from src.retrieval import search_docs`.
pythonpath = ["."]
testpaths = ["tests"]
# Les tests `integration` appellent une vraie API LLM : exclus par défaut,
# à lancer explicitement avec `uv run pytest -m integration`.
markers = ["integration: appelle une API LLM réelle (réseau + clé)"]
addopts = "-m 'not integration'"
